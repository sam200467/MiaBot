<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONGEKI 素材检索</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <header><div><p class="eyebrow">MIA · LOCAL LIBRARY</p><h1 id="title">ONGEKI 卡面图鉴</h1><p id="subtitle" class="subtitle">浏览从游戏数据中提取的完整卡面、角色图与头像</p></div><div id="count" class="count">载入中…</div></header>
  <main>
    <nav><a data-view="cards" href="/cards">卡面图鉴</a><a data-view="expressions" href="/expressions">角色表情</a></nav>
    <form id="search"><span>⌕</span><input id="query" autocomplete="off" placeholder="输入卡片 ID、卡名、角色名、稀有度或属性"><button>搜索</button></form>
    <div id="variants" class="variants" aria-label="图片类型"></div>
    <div id="status" class="status"></div><section id="grid" class="grid"></section><button id="more" class="more" hidden>加载更多</button>
  </main>
  <dialog id="viewer"><button class="close" aria-label="关闭">×</button><img><div class="viewer-info"></div></dialog>
  <script src="/app.js"></script>
</body></html>
