<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牌子完成度模板 CSS 实时调试器</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <aside class="editor-pane">
    <header>
      <div>
        <h1>牌子完成度模板 CSS 调试器</h1>
        <p>左侧修改，右侧即时预览；Ctrl+S 保存。</p>
      </div>
      <span id="save-state" class="state saved">已保存</span>
    </header>

    <section class="toolbar">
      <label>
        测试数据
        <select id="sample">
          <option value="template">新版模板布局</option>
          <option value="stress">爽击 120 曲压力测试</option>
        </select>
      </label>
      <label>
        跳到规则
        <select id="rule-jump">
          <option value="">请选择</option>
          <option value=".player-card {">玩家资料框</option>
          <option value=".level-groups {">等级区整体位置</option>
          <option value=".level-group {">等级与曲目列</option>
          <option value=".song-grid {">10 列曲绘网格</option>
          <option value=".song-jacket {">曲绘尺寸</option>
          <option value=".status-badges {">AB / FC / FB 徽章</option>
          <option value=".difficulty-summary {">底部四难度统计</option>
          <option value=".summary-card {">统计卡片</option>
        </select>
      </label>
    </section>

    <textarea id="css-editor" spellcheck="false" aria-label="theme.css 编辑器"></textarea>

    <footer>
      <span id="cursor-position">第 1 行，第 1 列</span>
      <div class="actions">
        <button id="reload" type="button" class="secondary">放弃未保存修改</button>
        <button id="save" type="button" class="primary">保存到 theme.css</button>
      </div>
    </footer>
  </aside>

  <main class="preview-pane">
    <div class="preview-toolbar">
      <strong>1080 × 1920 实时预览</strong>
      <span id="preview-state">正在载入……</span>
      <label>
        缩放
        <input id="zoom" type="range" min="15" max="100" step="1" value="40">
        <output id="zoom-value">40%</output>
      </label>
      <button id="fit" type="button" class="secondary">适应窗口</button>
      <button id="refresh-preview" type="button" class="secondary">刷新预览</button>
    </div>
    <div id="preview-viewport" class="preview-viewport">
      <div id="preview-stage" class="preview-stage">
        <iframe id="preview-frame" title="牌子完成度模板实时预览"></iframe>
      </div>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="editor.js"></script>
</body>
</html>
