<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>音击谱面图</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="sheet">
    <header class="hero">
      <div class="jacket"><img id="jacket" alt="歌曲曲绘"></div>
      <div class="song">
        <div class="song-top">
          <span id="difficulty" class="difficulty"></span>
          <span id="song-id" class="song-id"></span>
        </div>
        <h1 id="title"></h1>
        <p id="artist"></p>
        <dl class="facts" id="facts"></dl>
      </div>
      <div class="side-panel">
        <ul class="counts" id="counts"></ul>
        <ul class="legend" id="legend"></ul>
      </div>
    </header>
    <section class="chart" id="chart"></section>
    <footer class="credits">
      <span>自下而上阅读 · 左侧数字为小节号，<i class="bpm-dot"></i>BPM 变化，色带为变速 · 右侧分数为与上一个音符的间隔（几分音）</span>
      <span>Generated by: <b>MiaBot</b>　Function designed by: <b>sam2004</b></span>
    </footer>
  </main>
  <script src="ongeki-chart.js"></script>
  <script src="preview-data.js"></script>
  <script src="theme.js"></script>
</body>
</html>
