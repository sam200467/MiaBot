<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>谱面分析 CSS 调试器</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <aside class="editor-pane">
    <header>
      <div>
        <h1>谱面分析 CSS 调试器</h1>
        <p>正在编辑 themes/chart-info/renderer/theme.css；Ctrl+S 保存。</p>
      </div>
      <span id="save-state" class="state saved">已保存</span>
    </header>

    <section class="toolbar">
      <label>
        跳到规则
        <select id="rule-jump">
          <option value="">请选择</option>
          <option value="body {">背景图片与位置</option>
          <option value="#sheet {">画布与整体间距</option>
          <option value=".panel,\n.page-header {">透明面板 / 25px 模糊</option>
          <option value=".page-header {">顶部标题区域</option>
          <option value=".dashboard {">左右栏宽度</option>
          <option value=".jacket-frame {">曲绘尺寸与圆角</option>
          <option value=".song-copy {">曲名与作者</option>
          <option value=".difficulty-card {">Current Chart 透明卡片</option>
          <option value=".chart-facts {">Song ID / 总物量 / BELL</option>
          <option value=".unit-section {">BELL 等价区域</option>
          <option value=".compact-title {">BELL 等价标题位置</option>
          <option value=".content-column {">右侧两块高度</option>
          <option value=".score-panel,">右侧面板内边距</option>
          <option value="th, td {">表格行高与字号</option>
          <option value=".rank-image {">SSS+ 等评级素材</option>
          <option value=".platinum-star-image {">白金星素材尺寸</option>
          <option value=".platinum-star-image.tone-cyan">彩色白金星滤镜</option>
          <option value="footer {">底部信息</option>
        </select>
      </label>
    </section>

    <textarea id="css-editor" spellcheck="false" aria-label="正式 theme.css 编辑器"></textarea>

    <footer>
      <span id="cursor-position">第 1 行，第 1 列</span>
      <div class="actions">
        <button id="reload" type="button" class="secondary">放弃未保存修改</button>
        <button id="save" type="button" class="primary">保存到正式 theme.css</button>
      </div>
    </footer>
  </aside>

  <main class="preview-pane">
    <div class="preview-toolbar">
      <strong>1800×1200 实时预览</strong>
      <span id="preview-state">正在载入……</span>
      <label>
        缩放
        <input id="zoom" type="range" min="20" max="100" step="1" value="50">
        <output id="zoom-value">50%</output>
      </label>
      <button id="fit" type="button" class="secondary">适应窗口</button>
      <button id="refresh-preview" type="button" class="secondary">刷新预览</button>
    </div>
    <div id="preview-viewport" class="preview-viewport">
      <div id="preview-stage" class="preview-stage">
        <iframe id="preview-frame" title="谱面分析正式渲染器实时预览"></iframe>
      </div>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="editor.js"></script>
</body>
</html>
